name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/baby-name-fortune-service-gddHy
      - claude/bobath-website-redesign-nonomv
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # 사전 준비: Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작합니다.
        # (워크플로 토큰으로는 Pages 를 활성화할 수 없습니다.)

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
